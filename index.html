<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>熊ゲーム - 姿勢判定</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>🐻 熊ゲーム 姿勢判定</h1>

    <div class="camera-area">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="canvas"></canvas>

    </div>

    <p id="status">
        「カメラを開始」を押してください
    </p>

    <p id="score">
        姿勢スコア：--
    </p>

    <button id="startButton">
        カメラを開始
    </button>

    <script
        type="module"
        src="./main.js">
    </script>

</body>

</html>
