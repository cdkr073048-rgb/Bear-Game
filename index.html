<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>熊対策ゲーム</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>熊対策ゲーム</h1>

    <p id="message">
        カメラを開始してください
    </p>

    <div class="camera-area">

        <video
            id="video"
            autoplay
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

    </div>

    <button id="startButton">
        カメラを開始
    </button>

    <p id="result">
        判定待ち
    </p>

    <p id="score">
        姿勢スコア：--
    </p>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.js"></script>

    <script type="module" src="main.js"></script>

</body>

</html>
