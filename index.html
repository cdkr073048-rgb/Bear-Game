<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>熊ゲーム - 姿勢判定</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>🐻 熊ゲーム 姿勢判定</h1>

    <div class="camera-area">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="canvas"></canvas>

    </div>

    <p id="status">
        「カメラを開始」を押してください
    </p>

    <p id="score">
        姿勢スコア：--
    </p>

    <p id="referenceInfo">
        手本：未登録
    </p>

    <p id="hint">
        頭から腰のあたりまでが映る位置に立ってください。手本の登録も、プレイ時と同じ位置で行います。
    </p>

    <div class="controls">

        <button id="startButton">
            カメラを開始
        </button>

        <button id="registerButton" disabled>
            手本を登録(3秒後に撮影)
        </button>

        <button id="exportButton" disabled>
            手本をJSONで保存
        </button>

        <button id="clearButton" disabled>
            手本を削除
        </button>

    </div>

    <script
        type="module"
        src="./main.js">
    </script>

</body>

</html>
